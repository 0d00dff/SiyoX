name: Build Signed Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    name: 构建并签名 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装 Android SDK / NDK / CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;34.0.0 ndk;27.1.12297006 cmake;3.28.0'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 给 gradlew 添加执行权限
        run: chmod +x gradlew

      - name: 还原签名文件
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: 构建并签名 Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 上传签名后的 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk
